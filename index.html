<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>RuPay — Discover Your Aura</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #070b14;
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0px, 1.5vmin, 16px);
      user-select: none;
      overflow-x: hidden;
    }

    /* Responsive Kiosk Container adapting to mobile, foldable, tablet, laptop, desktop & vertical kiosks */
    .kiosk {
      position: relative;
      width: min(100%, 480px);
      height: min(calc(100dvh - clamp(0px, 3vmin, 32px)), 920px);
      min-height: 0;
      border-radius: clamp(0px, 2vmin, 20px);
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      background:
        radial-gradient(circle at 18% 12%, #063072 0%, transparent 48%),
        radial-gradient(circle at 85% 22%, #2b67ec 0%, transparent 45%),
        radial-gradient(circle at 20% 78%, #8c4fd5 0%, transparent 50%),
        radial-gradient(circle at 88% 92%, #ff5510 0%, #f25a67 42%, transparent 72%),
        linear-gradient(155deg, #042b69 0%, #1d5be0 34%, #8252d6 66%, #fc5c23 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        max(clamp(10px, 2.2vh, 28px), env(safe-area-inset-top, 10px))
        max(clamp(10px, 3.5vw, 26px), env(safe-area-inset-right, 10px))
        max(clamp(10px, 2.2vh, 28px), env(safe-area-inset-bottom, 10px))
        max(clamp(10px, 3.5vw, 26px), env(safe-area-inset-left, 10px));
    }

    /* Background white line-art doodles */
    .doodles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }

    .screen {
      position: relative;
      z-index: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      gap: clamp(4px, 1.2vh, 14px);
      padding-bottom: clamp(8px, 1.6vh, 16px);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      animation: fade 0.2s ease-out;
    }

    .screen::-webkit-scrollbar {
      display: none;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fade {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Top Brand Headers */
    .top-brand {
      text-align: center;
      flex-shrink: 0;
    }

    .rupay-logo {
      display: inline-block;
      width: clamp(135px, 19vh, 185px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.35));
    }

    .rupay-logo-lockup {
      width: clamp(142px, 18.5vh, 195px);
    }

    .subtitle-serif {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: clamp(0.95rem, 2.1vh, 1.25rem);
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.4px;
      margin-top: 0px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .subtitle-script {
      font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", cursive;
      font-size: clamp(1.5rem, 3.6vh, 2.2rem);
      line-height: 1.05;
      color: #ffffff;
      margin-top: -2px;
      transform: rotate(-3deg);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* Screen 1: 2x3 Aura Grid scaled dynamically to fit both height & width */
    .aura-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: max-content;
      gap: clamp(8px, 1.3vh, 14px) clamp(12px, 2.5vw, 18px);
      width: min(86%, 30.5vh);
      max-width: 300px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .aura-card {
      position: relative;
      aspect-ratio: 50 / 63;
      width: 100%;
      height: auto;
      background: #0a1022;
      border: clamp(2px, 0.4vmin, 3.5px) solid #091224;
      border-bottom: clamp(2.5px, 0.5vmin, 4px) solid #1e62d0;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      padding: 0;
      box-shadow: 0 8px 18px rgba(5, 15, 40, 0.45);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .aura-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .aura-card-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 4px 5px;
      background: linear-gradient(0deg, rgba(4, 12, 30, 0.9) 0%, rgba(4, 12, 30, 0.55) 65%, transparent 100%);
      color: #ffffff;
      font-size: clamp(0.56rem, 1.15vh, 0.68rem);
      font-weight: 600;
      letter-spacing: 0.2px;
      line-height: 1.15;
      text-align: center;
      pointer-events: none;
    }

    .aura-card:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: #ffffff;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.55), 0 10px 22px rgba(5, 15, 40, 0.6);
    }

    /* Glossy 3D Blue Pill Buttons matching reference */
    .glossy-btn {
      appearance: none;
      border: 1.5px solid rgba(120, 190, 255, 0.65);
      border-radius: 999px;
      background: radial-gradient(circle at 50% 25%, #2581ff 0%, #0a46a6 58%, #041a47 100%);
      box-shadow:
        0 6px 16px rgba(4, 18, 54, 0.55),
        inset 0 2px 4px rgba(255, 255, 255, 0.45),
        inset 0 -3px 6px rgba(2, 10, 32, 0.8);
      color: #ffffff;
      font-weight: 600;
      font-size: clamp(0.82rem, 1.8vh, 1rem);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: clamp(10px, 1.6vh, 14px) clamp(22px, 4.5vw, 34px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    #btnStart {
      min-width: clamp(200px, 48vw, 250px);
      padding: clamp(10px, 1.5vh, 14px) clamp(26px, 5vw, 38px);
      font-size: clamp(0.9rem, 1.9vh, 1.05rem);
      letter-spacing: 2px;
      margin: 2px 0;
      box-shadow:
        0 8px 24px rgba(4, 18, 54, 0.65),
        inset 0 2px 4px rgba(255, 255, 255, 0.5),
        inset 0 -3px 6px rgba(2, 10, 32, 0.85);
    }

    .glossy-btn:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .glossy-btn:active {
      transform: translateY(1px);
    }

    .glossy-btn-sm {
      font-size: clamp(0.66rem, 1.4vh, 0.76rem);
      padding: clamp(6px, 1vh, 9px) clamp(11px, 2.4vw, 17px);
      letter-spacing: 0.8px;
    }

    /* Circular Shutter Button */
    .shutter-btn {
      width: clamp(48px, 7.5vh, 66px);
      height: clamp(48px, 7.5vh, 66px);
      border-radius: 50%;
      border: 2px solid rgba(145, 205, 255, 0.85);
      background: radial-gradient(circle at 50% 30%, #2f8fff 0%, #0b4db5 60%, #041a47 100%);
      box-shadow:
        0 0 0 4px rgba(10, 42, 105, 0.55),
        0 8px 20px rgba(4, 18, 54, 0.65),
        inset 0 2px 5px rgba(255, 255, 255, 0.55);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .shutter-btn:hover {
      filter: brightness(1.12);
      transform: scale(1.05);
    }

    /* Metallic Blue Portrait Frame (Screen 2 & 3) scaled by both width and viewport height */
    .blue-frame {
      width: min(82%, 34vh);
      max-width: 315px;
      aspect-ratio: 212 / 295;
      padding: clamp(7px, 1.2vmin, 12px);
      background: linear-gradient(180deg, #041330 0%, #0d439c 45%, #1d6ee0 78%, #072152 100%);
      box-shadow:
        0 14px 32px rgba(4, 14, 38, 0.65),
        inset 0 1px 2px rgba(255, 255, 255, 0.35);
      position: relative;
      margin: auto;
      flex-shrink: 1;
      min-height: 0;
    }

    .viewport-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: #12131a;
      overflow: hidden;
    }

    #cameraVideo,
    #stageResultCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #cameraVideo {
      transform: scaleX(-1);
      background: #080d1a;
    }

    #auraLiveOverlay {
      display: none;
    }

    .cam-status {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(6, 14, 34, 0.82);
      color: #ffffff;
      font-size: clamp(0.75rem, 1.6vh, 0.9rem);
      text-align: center;
      padding: 16px;
      z-index: 3;
    }

    .cam-status.hidden {
      display: none;
    }

    #aiLoadingOverlay {
      background: rgba(5, 8, 20, 0.96);
    }

    .loading-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(142, 197, 255, 0.25);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: auraSpin 0.85s linear infinite;
    }

    @keyframes auraSpin {
      to { transform: rotate(360deg); }
    }

    .result-actions.hidden {
      display: none !important;
    }

    .camera-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 16px);
      width: 100%;
      flex-shrink: 0;
      margin-bottom: clamp(10px, 2vh, 20px);
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 1.2vh, 12px);
      width: 100%;
      flex-shrink: 0;
    }

    .result-sub-actions {
      display: flex;
      gap: clamp(5px, 1.2vw, 10px);
      justify-content: center;
      flex-wrap: wrap;
    }

    .toast-msg {
      font-size: 0.74rem;
      color: #fff;
      background: rgba(4, 24, 66, 0.72);
      padding: 3px 12px;
      border-radius: 999px;
      min-height: 20px;
      display: inline-flex;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .toast-msg.visible {
      opacity: 1;
    }

    /* Modal for QR Code & Black-Framed Photo Output Preview */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 12, 30, 0.88);
      backdrop-filter: blur(4px);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2.5vmin, 18px);
      gap: 10px;
      text-align: center;
      overflow-y: auto;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background: #0d1629;
      border: 1.5px solid rgba(120, 190, 255, 0.45);
      border-radius: 14px;
      padding: clamp(12px, 2vmin, 18px);
      width: min(92vw, 320px);
      max-height: 82dvh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }

    #qrCanvas {
      background: #ffffff;
      padding: 8px;
      border-radius: 8px;
      max-width: min(55vmin, 190px);
      max-height: min(55vmin, 190px);
    }

    .polaroid-stage {
      width: min(84vw, 37vh);
      max-width: 340px;
      aspect-ratio: 520 / 760;
      position: relative;
      margin: auto;
      flex-shrink: 0;
      background: #111214;
      border-radius: 4px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.78);
      overflow: hidden;
    }

    #outputPolaroidCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #modalPolaroidCanvas {
      width: auto;
      max-width: min(76vw, 260px);
      max-height: 62dvh;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.8);
    }

    /* Mobile QR Scan Landing Screen — shows ONLY the Polaroid frame + responsive actions */
    .qr-frame-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
      width: 100%;
      margin: auto;
    }

    #qrLandingImg {
      width: auto;
      height: auto;
      max-width: min(86vw, 44vh);
      max-height: 68dvh;
      aspect-ratio: 520 / 760;
      object-fit: contain;
      display: block;
      border-radius: 4px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.75);
    }

    .qr-landing-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1.4vh, 14px);
      width: min(88vw, 340px);
      flex-shrink: 0;
      margin-bottom: clamp(4px, 1vh, 12px);
    }

    .qr-btn-download {
      width: 100%;
      border-radius: 999px;
      border: none;
      padding: clamp(11px, 1.7vh, 15px) 22px;
      font-size: clamp(0.8rem, 1.7vh, 0.96rem);
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #1e1b4b;
      background: linear-gradient(90deg, #f8fafc 0%, #f9a8d4 52%, #fb923c 100%);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .qr-btn-download:active,
    .qr-btn-share:active {
      transform: scale(0.98);
    }

    .qr-btn-share {
      width: 82%;
      border-radius: 999px;
      border: 1.5px solid rgba(165, 180, 252, 0.55);
      padding: clamp(9px, 1.5vh, 13px) 20px;
      font-size: clamp(0.75rem, 1.55vh, 0.9rem);
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ffffff;
      background: rgba(15, 23, 54, 0.78);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    /* Password Gate Overlay (Prompts on every page load / refresh) */
    .password-gate-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 12%, #063072 0%, transparent 48%),
        radial-gradient(circle at 85% 22%, #2b67ec 0%, transparent 45%),
        radial-gradient(circle at 20% 78%, #8c4fd5 0%, transparent 50%),
        radial-gradient(circle at 88% 92%, #ff5510 0%, #f25a67 42%, transparent 72%),
        linear-gradient(155deg, #042b69 0%, #1d5be0 34%, #8252d6 66%, #fc5c23 100%);
    }

    .password-gate-overlay.hidden {
      display: none !important;
    }

    .password-gate-card {
      width: min(90%, 340px);
      background: rgba(8, 22, 58, 0.88);
      border: 1.5px solid rgba(135, 195, 255, 0.45);
      border-radius: 18px;
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
    }

    .password-gate-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1.5px solid rgba(147, 197, 253, 0.55);
      background: rgba(4, 14, 38, 0.85);
      color: #ffffff;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 3px;
      outline: none;
    }

    .password-gate-input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 12px rgba(96, 165, 250, 0.45);
    }

    .password-gate-error {
      color: #fda4af;
      font-size: 0.78rem;
      font-weight: 600;
      min-height: 18px;
      text-align: center;
    }

    /* Ultra-small phones & folded foldables (Galaxy Z Fold cover, iPhone SE, <= 360px) */
    @media (max-width: 360px) {
      .aura-grid {
        width: min(90%, 28vh);
        gap: 6px 10px;
      }
      .aura-card-label {
        font-size: 0.52rem;
        padding: 10px 2px 4px;
      }
      .camera-bar {
        gap: 6px;
      }
      .glossy-btn-sm {
        font-size: 0.62rem;
        padding: 6px 9px;
      }
      .shutter-btn {
        width: 44px;
        height: 44px;
      }
    }

    /* Portrait orientation (mobile, tablet portrait, 1080x1920 & 4K vertical kiosks): cover 100% of the page edge-to-edge */
    @media (orientation: portrait) {
      body {
        padding: 0;
      }
      .kiosk {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-width: none;
        max-height: none;
        border-radius: 0;
      }
      .rupay-logo {
        width: clamp(135px, 19vh, 420px);
      }
      .rupay-logo-lockup {
        width: clamp(142px, 18.5vh, 430px);
      }
      .subtitle-serif {
        font-size: clamp(0.95rem, 2.2vh, 2.7rem);
      }
      .aura-grid {
        width: min(86vw, 31vh);
        max-width: none;
        gap: clamp(8px, 1.3vh, 26px) clamp(12px, 2.5vw, 36px);
      }
      .aura-card {
        border-radius: clamp(4px, 0.7vmin, 12px);
      }
      .aura-card-label {
        font-size: clamp(0.56rem, 1.2vh, 1.45rem);
        padding: clamp(12px, 1.8vh, 28px) 6px clamp(5px, 0.7vh, 12px);
      }
      .glossy-btn {
        font-size: clamp(0.82rem, 1.8vh, 2.1rem);
        padding: clamp(10px, 1.6vh, 30px) clamp(22px, 4.5vw, 68px);
      }
      .glossy-btn-sm {
        font-size: clamp(0.66rem, 1.4vh, 1.65rem);
        padding: clamp(6px, 1vh, 20px) clamp(11px, 2.4vw, 38px);
      }
      #btnStart {
        min-width: clamp(200px, 46vw, 520px);
        padding: clamp(10px, 1.6vh, 32px) clamp(26px, 5vw, 76px);
        font-size: clamp(0.9rem, 2vh, 2.35rem);
      }
      .shutter-btn {
        width: clamp(48px, 7.2vh, 138px);
        height: clamp(48px, 7.2vh, 138px);
      }
      .shutter-btn svg {
        width: clamp(22px, 3.2vh, 62px);
        height: clamp(22px, 3.2vh, 62px);
      }
      .blue-frame {
        width: min(84vw, 35vh);
        max-width: none;
      }
      .polaroid-stage {
        width: min(86vw, 41vh);
        max-width: none;
      }
      #qrLandingImg {
        max-width: min(88vw, 48vh);
        max-height: 70dvh;
      }
      .qr-landing-actions {
        width: min(86vw, 46vh);
      }
      .qr-btn-download {
        padding: clamp(12px, 1.8vh, 26px) clamp(20px, 4vw, 48px);
        font-size: clamp(0.82rem, 1.7vh, 1.85rem);
      }
      .qr-btn-share {
        padding: clamp(10px, 1.5vh, 22px) clamp(18px, 3.6vw, 42px);
        font-size: clamp(0.76rem, 1.5vh, 1.65rem);
      }
      #modalPolaroidCanvas {
        max-width: min(78vw, 44vh);
      }
    }

    /* Tablets in landscape (iPad Mini, iPad Air, Android tablets) */
    @media (min-width: 641px) and (max-width: 1024px) and (orientation: landscape) {
      .kiosk {
        width: min(90vw, 520px);
        height: min(94dvh, 960px);
      }
      .aura-grid {
        width: min(86%, 31vh);
        max-width: 315px;
      }
      .blue-frame {
        width: min(84%, 35vh);
        max-width: 340px;
      }
    }

    /* Compact-height laptops & 125%-150% DPI scaled desktop browsers */
    @media (max-height: 740px) and (orientation: landscape) {
      .kiosk {
        height: 96dvh;
        padding: 10px 18px;
      }
      .rupay-logo {
        width: clamp(125px, 16.5vh, 165px);
      }
      .rupay-logo-lockup {
        width: clamp(132px, 17vh, 175px);
      }
      .subtitle-serif {
        font-size: clamp(0.85rem, 1.8vh, 1.1rem);
      }
      .subtitle-script {
        font-size: clamp(1.25rem, 3vh, 1.75rem);
      }
      .aura-grid {
        width: min(84%, 28.5vh);
        gap: 6px 10px;
      }
      .blue-frame {
        width: min(80%, 34vh);
      }
    }

    /* Large landscape displays */
    @media (min-width: 768px) and (min-height: 920px) and (orientation: landscape) {
      .kiosk {
        width: min(88vw, 580px);
        height: min(92dvh, 1080px);
      }
      .aura-grid {
        width: min(86%, 31vh);
        max-width: 340px;
      }
      .blue-frame {
        width: min(84%, 36vh);
        max-width: 370px;
      }
    }

    /* Short landscape screens (phones in landscape / compact notebooks <= 580px tall) */

      const tw = trackCanvas.width;
      const th = trackCanvas.height;
      const tCtx = trackCanvas.getContext("2d", { willReadFrequently: true });
      const sw = sourceEl.videoWidth || sourceEl.width || 0;
      const sh = sourceEl.videoHeight || sourceEl.height || 0;
      if (!sw || !sh) return;

      tCtx.save();
      tCtx.clearRect(0, 0, tw, th);
      if (isMirrored) {
        tCtx.translate(tw, 0);
        tCtx.scale(-1, 1);
      }
      const scale = Math.max(tw / sw, th / sh);
      const dw = sw * scale;
      const dh = sh * scale;
      tCtx.drawImage(sourceEl, (tw - dw) / 2, (th - dh) / 2, dw, dh);

      const sCtx = skinMaskCanvas.getContext("2d");

      let sumX = 0;
      let sumY = 0;
      let sumW = 0;
      const skinFlags = new Uint8Array(tw * th);

      const yMin = Math.floor(th * 0.06);
      const yMax = Math.floor(th * 0.80);
      for (let y = yMin; y < yMax; y++) {
        for (let x = 0; x < tw; x++) {
          const idx = (y * tw + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          if (r > 58 && g > 36 && b > 24 && r > g && g >= b - 10) {
            const rb = r - b;
            const gr = g / r;
            if (rb >= 15 && rb <= 112 && gr >= 0.55 && gr <= 0.93) {
              const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
              const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
              if (cb >= 78 && cb <= 128 && cr >= 133 && cr <= 174) {
                skinFlags[y * tw + x] = 1;
                // Weight upper/middle portrait skin pixels higher to lock onto the face rather than lower arms
                const wy = y < th * 0.66 ? 1.5 : 0.6;
                sumX += (x / tw) * wy;
                sumY += (y / th) * wy;
                sumW += wy;
              }
            }
          }
        }
      }

      if (sumW > 18) {
        const mx = sumX / sumW;
        const my = sumY / sumW;

        // Pass 2: refine centroid & spread around the primary face cluster and build per-pixel skin shield mask
        let cxSum = 0;
        let cySum = 0;
        let cCount = 0;
        let varX = 0;
        let varY = 0;

        for (let y = yMin; y < yMax; y++) {
          const ny = y / th;
          for (let x = 0; x < tw; x++) {
            if (!skinFlags[y * tw + x]) continue;
            const nx = x / tw;
            const dx = nx - mx;
            const dy = ny - my;
            // Protect all detected skin pixels in the portrait frame
            const mIdx = (y * tw + x) * 4;
            mData[mIdx] = 0;
            mData[mIdx + 1] = 0;
            mData[mIdx + 2] = 0;
            mData[mIdx + 3] = 255;
            if (dx * dx + dy * dy <= 0.18) {
              cxSum += nx;
              cySum += ny;
              cCount++;
            }
          }
        }

        sCtx.putImageData(maskImg, 0, 0);

        if (cCount > 12) {
          const cx = cxSum / cCount;
          const cy = Math.max(0.20, (cySum / cCount) - 0.02);
          for (let y = yMin; y < yMax; y++) {
            const ny = y / th;
            for (let x = 0; x < tw; x++) {
              if (!skinFlags[y * tw + x]) continue;
              const nx = x / tw;
              const dx = nx - cx;
              const dy = ny - cy;
              if (dx * dx + dy * dy <= 0.14) {
                varX += dx * dx;
                varY += dy * dy;
              }
            }
          }
          const stdX = Math.sqrt(varX / cCount);
          const stdY = Math.sqrt(varY / cCount);
          const targetRx = Math.max(0.16, Math.min(0.24, stdX * 2.25));
          const targetRy = Math.max(0.19, Math.min(0.27, stdY * 2.35));
          const lerp = snapImmediately ? 1 : 0.45;
          faceState.x += (cx - faceState.x) * lerp;
          faceState.y += (cy - faceState.y) * lerp;
          faceState.rx += (targetRx - faceState.rx) * lerp;
          faceState.ry += (targetRy - faceState.ry) * lerp;
        }
      }

      // Optional hardware FaceDetector refinement when supported by browser
      if (nativeFaceDetector && !updateFaceTracking._busy) {
        updateFaceTracking._busy = true;
        nativeFaceDetector
          .detect(trackCanvas)
          .then((faces) => {
            if (faces && faces.length > 0) {
              const box = faces[0].boundingBox;
              const fx = (box.x + box.width * 0.5) / tw;
              const fy = (box.y + box.height * 0.48) / th;
              const frx = Math.max(0.135, Math.min(0.185, (box.width / tw) * 0.52));
              const fry = Math.max(0.165, Math.min(0.215, (box.height / th) * 0.52));
              faceState.x = fx;
              faceState.y = fy;
              faceState.rx = frx;
              faceState.ry = fry;
            }
          })
          .catch(() => {})
          .finally(() => {
            updateFaceTracking._busy = false;
          });
      }
    }

    // Renders the full, vivid Auracam 6000 color cloud field covering 100% of the frame (zero black borders/corners)
    function renderAuracamCloudField(w, h) {
      if (cloudCanvas.width !== w) cloudCanvas.width = w;
      if (cloudCanvas.height !== h) cloudCanvas.height = h;
      const cCtx = cloudCanvas.getContext("2d");
      const maxDim = Math.max(w, h);
      const shiftX = (faceState.x - 0.5) * 0.24;
      const shiftY = (faceState.y - 0.48) * 0.18;
      const blobs = selectedAura.blobs || [];

      // 1. Full-bleed color base gradient across the entire canvas so zero black shows anywhere in the frame
      cCtx.save();
      cCtx.globalCompositeOperation = "source-over";
      const c0 = blobs[0]?.color || "#ec1b9b";
      const c1 = blobs[2]?.color || blobs[1]?.color || "#6d28d9";
      const c2 = blobs[blobs.length - 1]?.color || "#f59e0b";
      const baseGrad = cCtx.createLinearGradient(0, 0, w, h);
      baseGrad.addColorStop(0, c0);
      baseGrad.addColorStop(0.52, c1);
      baseGrad.addColorStop(1, c2);
      cCtx.fillStyle = baseGrad;
      cCtx.fillRect(0, 0, w, h);

      // 2. Large, rich Gaussian-blurred Aura clouds expanded to cover 100% of the frame edge-to-edge
      blobs.forEach((b) => {
        cCtx.save();
        cCtx.filter = "blur(42px)";
        const bx = b.x + shiftX;
        const by = b.y + shiftY;
        cCtx.translate(w * bx, h * by);
        cCtx.scale(1, b.ry / b.rx);
        const r = maxDim * b.rx * 1.55;

        // Rich saturated cloud body pass
        cCtx.globalCompositeOperation = "source-over";
        cCtx.globalAlpha = Math.min(1, b.alpha * 0.96);
        const g1 = cCtx.createRadialGradient(0, 0, r * 0.05, 0, 0, r);
        g1.addColorStop(0, b.color);
        g1.addColorStop(0.68, b.color);
        g1.addColorStop(1, "rgba(0,0,0,0)");
        cCtx.fillStyle = g1;
        cCtx.beginPath();
        cCtx.arc(0, 0, r, 0, Math.PI * 2);
        cCtx.fill();

        // Luminous Kirlian bloom pass
        cCtx.globalCompositeOperation = "screen";
        cCtx.globalAlpha = b.alpha * 0.58;
        cCtx.fillStyle = g1;
        cCtx.beginPath();
        cCtx.arc(0, 0, r * 1.15, 0, Math.PI * 2);
        cCtx.fill();
        cCtx.restore();
      });

      cCtx.restore();
    }

    // Builds a tight skin + inner-face shield (hides office chair behind ears and turns bright shirt into a dark Aura-lit silhouette)
    function buildSilhouetteMask(w, h) {
      if (silhouetteMaskCanvas.width !== w) silhouetteMaskCanvas.width = w;
      if (silhouetteMaskCanvas.height !== h) silhouetteMaskCanvas.height = h;
      const sCtx = silhouetteMaskCanvas.getContext("2d");
      sCtx.clearRect(0, 0, w, h);

      const fx = w * faceState.x;
      const fy = h * faceState.y;
      const frx = w * faceState.rx;
      const fry = h * faceState.ry;

      // 1. High-protection silhouette for hair & shoulders so only a very light Aura mist touches edges
      sCtx.save();
      sCtx.filter = "blur(20px)";

      // Protect shoulders/chest (leaves only ~15-22% very light aura tint on clothing)
      const shoulderAlpha = selectedAura.preserveClothing ? 0.85 : 0.76;
      const hairAlpha = selectedAura.preserveClothing ? 0.78 : 0.70;
      sCtx.fillStyle = `rgba(0,0,0,${shoulderAlpha})`;
      sCtx.beginPath();
      sCtx.ellipse(fx, fy + h * 0.36, frx * 1.65, h * 0.24, 0, 0, Math.PI * 2);
      sCtx.fill();

      // Top hair crown (only a very light aura rim glow over hair)
      sCtx.fillStyle = `rgba(0,0,0,${hairAlpha})`;
      sCtx.beginPath();
      sCtx.ellipse(fx, fy - fry * 0.14, frx * 1.15, fry * 1.10, 0, 0, Math.PI * 2);
      sCtx.fill();
      sCtx.restore();

      // 2. Per-pixel detected skin mask (protects actual face & neck skin at 100%)
      sCtx.save();
      sCtx.filter = "blur(8px)";
      sCtx.drawImage(skinMaskCanvas, 0, 0, w, h);
      sCtx.drawImage(skinMaskCanvas, 0, 0, w, h);
      sCtx.drawImage(skinMaskCanvas, 0, 0, w, h);
      sCtx.restore();

      // 3. Feathered full-face & neck shield (0% filter on face, very soft feather at outer hair edge)
      sCtx.save();
      sCtx.filter = "blur(12px)";
      sCtx.fillStyle = "rgba(0,0,0,1)";
      sCtx.beginPath();
      sCtx.ellipse(fx, fy + fry * 0.04, frx * 1.18, fry * 1.24, 0, 0, Math.PI * 2);
      sCtx.fill();
      sCtx.restore();

      // 4. Pure solid 1.0 alpha core over entire face, forehead, cheeks, chin, and neck (0% Aura effect on face)
      sCtx.save();
      sCtx.fillStyle = "rgba(0,0,0,1)";
      sCtx.beginPath();
      sCtx.ellipse(fx, fy + fry * 0.03, frx * 1.02, fry * 1.08, 0, 0, Math.PI * 2);
      sCtx.fill();
      sCtx.restore();
    }

    // Restores 100% untouched raw camera pixels over the face (no filter, no blur, no cloud wash on face)
    function restoreOriginalFace(ctx, w, h) {
      if (faceMaskCanvas.width !== w) faceMaskCanvas.width = w;
      if (faceMaskCanvas.height !== h) faceMaskCanvas.height = h;
      const mCtx = faceMaskCanvas.getContext("2d");
      mCtx.clearRect(0, 0, w, h);

      // Draw 100% unmodified raw camera frame
      mCtx.save();
      mCtx.globalCompositeOperation = "source-over";
      mCtx.filter = "none";
      mCtx.drawImage(rawCaptureCanvas, 0, 0, w, h);
      mCtx.restore();

      buildSilhouetteMask(w, h);
      mCtx.globalCompositeOperation = "destination-in";
      mCtx.drawImage(silhouetteMaskCanvas, 0, 0, w, h);

      // Paint untouched face strictly on top as the final pass — no cloud wash drawn after this
      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.drawImage(faceMaskCanvas, 0, 0, w, h);
      ctx.restore();
    }

    // Applies the Auracam 6000 Studio Silhouette + Gaussian Cloud Filter in a single clean pass (zero duplicate/ghost layering)
    function paintAuraGlowOverlay(ctx, w, h, isLiveOverlay) {
      renderAuracamCloudField(w, h);
      buildSilhouetteMask(w, h);

      // Punch the tracked face/neck/shoulders silhouette directly out of cloudCanvas so the person is only ever drawn ONCE
      const cCtx = cloudCanvas.getContext("2d");
      cCtx.save();
      cCtx.globalCompositeOperation = "destination-out";
      cCtx.drawImage(silhouetteMaskCanvas, 0, 0, w, h);
      cCtx.restore();

      if (isLiveOverlay) ctx.clearRect(0, 0, w, h);

      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.drawImage(cloudCanvas, 0, 0, w, h);
      ctx.restore();
    }

    function startLiveTrackingLoop() {
      if (liveTrackRaf) cancelAnimationFrame(liveTrackRaf);
      const oCtx = auraLiveOverlay.getContext("2d");
      const w = auraLiveOverlay.width;
      const h = auraLiveOverlay.height;
      function step() {
        if (!usingWebcam || !screen2.classList.contains("active")) {
          liveTrackRaf = null;
          return;
        }
        if (!isFrozen && cameraVideo.videoWidth > 0) {
          updateFaceTracking(cameraVideo, true, false);
          paintAuraGlowOverlay(oCtx, w, h, true);
        }
        liveTrackRaf = requestAnimationFrame(step);
      }
      liveTrackRaf = requestAnimationFrame(step);
    }

    async function openCameraPreview() {
      isFrozen = false;

      camStatusText.textContent = "Opening camera...";
      btnRetryCam.style.display = "none";

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Camera API not available in this browser");
        }
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
        } catch (_) {
          mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }
        cameraVideo.srcObject = mediaStream;
        await cameraVideo.play();
        usingWebcam = true;
        camStatus.classList.add("hidden");
        updateFaceTracking(cameraVideo, true, true);
        startLiveTrackingLoop();
      } catch (err) {
        usingWebcam = false;
        camStatus.classList.remove("hidden");
        camStatusText.textContent = "Please allow camera access in your browser to preview";
        btnRetryCam.style.display = "inline-flex";
      }

    });

    function stopCamera() {
      if (liveTrackRaf) {
        cancelAnimationFrame(liveTrackRaf);
        liveTrackRaf = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }
      cameraVideo.srcObject = null;
    }

    // Draws captured camera frame + distinct per-filter Kirlian Aura overlay while keeping the face 100% original
    function drawAuraFrame(ctx, w, h) {
      const rawCtx = rawCaptureCanvas.getContext("2d");
      rawCtx.fillStyle = "#080d1a";
      rawCtx.fillRect(0, 0, w, h);

      if (usingWebcam && cameraVideo.videoWidth > 0) {
        rawCtx.save();
        rawCtx.filter = "none";
        rawCtx.translate(w, 0);
        rawCtx.scale(-1, 1);
        const vw = cameraVideo.videoWidth;
        const vh = cameraVideo.videoHeight;
        const scale = Math.max(w / vw, h / vh);
        const dw = vw * scale;
        const dh = vh * scale;
        rawCtx.drawImage(cameraVideo, (w - dw) / 2, (h - dh) / 2, dw, dh);
        rawCtx.restore();
      }

      updateFaceTracking(rawCaptureCanvas, false, true);
      // Single base draw of the camera capture + single masked Aura overlay (zero duplicate/double-exposure ghosting)
      ctx.globalCompositeOperation = "source-over";
      ctx.drawImage(rawCaptureCanvas, 0, 0, w, h);
      paintAuraGlowOverlay(ctx, w, h, false);
    }

    // Removes the background via Bria AI and composites the Auracam 6000 Aura effect around the isolated subject

          mCtx.filter = "blur(10px)";

          mCtx.drawImage(skinMaskCanvas, 0, 0, w, h);

          mCtx.beginPath();
          mCtx.ellipse(fx, fy + fry * 0.03, frx * 1.15, fry * 1.22, 0, 0, Math.PI * 2);
          mCtx.fill();
          mCtx.restore();

          ctx.save();
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
          ctx.drawImage(faceMaskCanvas, 0, 0, w, h);
          ctx.restore();

        } else if (data.imageDataUrl) {

          const gw = genImg.naturalWidth || w;
          const gh = genImg.naturalHeight || h;
          const scale = Math.max(w / gw, h / gh);
          const dw = gw * scale;

          ctx.save();
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
          ctx.filter = "none";

    // Renders the final black-bordered Photo Output (with RuPay bottom-left & Own the edge bottom-right)

      // Matte black Polaroid frame with white outer border strip
      ctx.fillStyle = "#111214";
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, w - 10, h - 10);

      // Draw captured portrait inside black frame borders
      const padX = 28;
      const padTop = 28;
      const photoW = w - padX * 2;
      const photoH = h - padTop - 110;
      ctx.drawImage(stageResultCanvas, 0, 0, stageResultCanvas.width, stageResultCanvas.height, padX, padTop, photoW, photoH);

      // Bottom-left official white RuPay wordmark + triangles (442x116)
      const footerY = h - 42;
      if (rupayWordmarkImg.complete && rupayWordmarkImg.naturalWidth > 0) {
        ctx.drawImage(rupayWordmarkImg, 28, h - 72, 138, 36);
      } else {
        ctx.fillStyle = "#ffffff";
        ctx.font = "italic 900 32px Arial, Helvetica, sans-serif";
        ctx.fillText("RuPay", 28, footerY);
      }

      // Bottom-right official white "Own the edge" artwork (1024x406)
      if (ownTheEdgeImg.complete && ownTheEdgeImg.naturalWidth > 0) {
        ctx.drawImage(ownTheEdgeImg, w - 28 - 170, h - 88, 170, 67);
      } else {
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "italic 30px 'Brush Script MT', 'Segoe Script', cursive";
        ctx.textAlign = "right";
        ctx.fillText("Own the edge", w - 28, footerY - 2);
        ctx.restore();
      }

      if (modalPolaroidCanvas) {
        const mCtx = modalPolaroidCanvas.getContext("2d");
        mCtx.clearRect(0, 0, w, h);
        mCtx.drawImage(outputPolaroidCanvas, 0, 0, w, h);
      }

      // Keep hidden print image synced
      printImg.src = outputPolaroidCanvas.toDataURL("image/png");
    }

    function captureAndShowResult() {
      try {
        successChime.muted = true;
        successChime.play().then(() => {
          successChime.pause();
          successChime.currentTime = 0;
          successChime.muted = false;
        }).catch(() => {
          successChime.muted = false;
        });
      } catch (_) {}
      resultActions.classList.add("hidden");
      aiLoadingText.textContent = "Generating...";
      aiLoadingOverlay.classList.remove("hidden");
      const ctx = stageResultCanvas.getContext("2d");
      drawAuraFrame(ctx, stageResultCanvas.width, stageResultCanvas.height);
      stopCamera();
      passId = "RP-" + Date.now().toString(36).toUpperCase();
      cloudinaryPhotoUrl = "";
      cloudinaryUploadPromise = null;
      buildPhotoOutputCanvas();
      showScreen(3);

      // Generate image first, then reveal the action buttons
      generateWithOpenAi(false);
    }

    // Pure-JS ISO/IEC 18004 QR Code Generator (Versions 2-L to 5-L, up to 106 bytes for full Cloudinary URLs)
    function renderQrCode(canvas, text) {
      const rawBytes = Array.from(new TextEncoder().encode(text));
      // Pick smallest single-block Level-L version that fits rawBytes (2 bytes overhead for mode + length)
      const versions = [
        { ver: 2, size: 25, align: 18, dataCap: 34, ecLen: 10 },
        { ver: 3, size: 29, align: 22, dataCap: 55, ecLen: 15 },
        { ver: 4, size: 33, align: 26, dataCap: 80, ecLen: 20 },
        { ver: 5, size: 37, align: 30, dataCap: 108, ecLen: 26 }
      ];
      const spec = versions.find((v) => rawBytes.length <= v.dataCap - 2) || versions[versions.length - 1];
      const bytes = rawBytes.slice(0, spec.dataCap - 2);
      const { size, align, dataCap, ecLen } = spec;

      const mat = Array.from({ length: size }, () => Array(size).fill(0));
      const reserved = Array.from({ length: size }, () => Array(size).fill(false));

      function placeFinder(r0, c0) {
        for (let r = -1; r <= 7; r++) {
          for (let c = -1; c <= 7; c++) {
            const rr = r0 + r, cc = c0 + c;
            if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
            const inOuter = r >= 0 && r <= 6 && c >= 0 && c <= 6;
            const inRing = r === 0 || r === 6 || c === 0 || c === 6;
            const inCore = r >= 2 && r <= 4 && c >= 2 && c <= 4;
            mat[rr][cc] = inOuter && (inRing || inCore) ? 1 : 0;
            reserved[rr][cc] = true;
          }
        }
      }
      placeFinder(0, 0);
      placeFinder(0, size - 7);
      placeFinder(size - 7, 0);

      for (let r = -2; r <= 2; r++) {
        for (let c = -2; c <= 2; c++) {
          const rr = align + r, cc = align + c;
          mat[rr][cc] = (Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0)) ? 1 : 0;
          reserved[rr][cc] = true;
        }
      }

      for (let i = 8; i < size - 8; i++) {
        if (!reserved[6][i]) { mat[6][i] = i % 2 === 0 ? 1 : 0; reserved[6][i] = true; }
        if (!reserved[i][6]) { mat[i][6] = i % 2 === 0 ? 1 : 0; reserved[i][6] = true; }
      }

      mat[size - 8][8] = 1;
      reserved[size - 8][8] = true;
      for (let i = 0; i < 9; i++) { reserved[8][i] = true; reserved[i][8] = true; }
      for (let i = size - 8; i < size; i++) { reserved[8][i] = true; reserved[i][8] = true; }

      const bits = [];
      const pushBits = (val, len) => {
        for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
      };
      pushBits(0b0100, 4);
      pushBits(bytes.length, 8);
      bytes.forEach((b) => pushBits(b, 8));
      pushBits(0, 4);
      while (bits.length % 8 !== 0) bits.push(0);

      const dataWords = [];
      for (let i = 0; i < bits.length; i += 8) {
        let b = 0;
        for (let j = 0; j < 8; j++) b = (b << 1) | (bits[i + j] || 0);
        dataWords.push(b);
      }
      const padBytes = [0xec, 0x11];
      let pIdx = 0;
      while (dataWords.length < dataCap) dataWords.push(padBytes[pIdx++ % 2]);

      const exp = new Uint8Array(512);
      const log = new Uint8Array(256);
      let x = 1;
      for (let i = 0; i < 255; i++) {
        exp[i] = x;
        log[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
      }
      for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];

      let gen = [1];
      for (let i = 0; i < ecLen; i++) {
        const next = new Array(gen.length + 1).fill(0);
        for (let j = 0; j < gen.length; j++) {
          next[j] ^= gen[j];
          next[j + 1] ^= exp[log[gen[j]] + i];
        }
        gen = next;
      }

      const msg = [...dataWords, ...new Array(ecLen).fill(0)];
      for (let i = 0; i < dataWords.length; i++) {
        const coef = msg[i];
        if (coef !== 0) {
          for (let j = 0; j < gen.length; j++) {
            msg[i + j] ^= exp[log[gen[j]] + log[coef]];
          }
        }
      }
      const allWords = [...dataWords, ...msg.slice(dataWords.length)];
      const finalBits = [];
      allWords.forEach((w) => {
        for (let i = 7; i >= 0; i--) finalBits.push((w >> i) & 1);
      });

      let bitIdx = 0;
      let up = true;
      for (let right = size - 1; right >= 1; right -= 2) {
        if (right === 6) right = 5;
        for (let vert = 0; vert < size; vert++) {
          const r = up ? size - 1 - vert : vert;
          for (let j = 0; j < 2; j++) {
            const c = right - j;
            if (!reserved[r][c]) {
              const bit = bitIdx < finalBits.length ? finalBits[bitIdx++] : 0;
              mat[r][c] = bit ^ ((r + c) % 2 === 0 ? 1 : 0);
            }
          }
        }
        up = !up;
      }

      const fmt = 0x77c4;
      const fBits = [];
      for (let i = 14; i >= 0; i--) fBits.push((fmt >> i) & 1);
      const fPos1 = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
      fPos1.forEach(([r, c], idx) => { mat[r][c] = fBits[idx]; });
      for (let i = 0; i < 7; i++) mat[size - 1 - i][8] = fBits[i];
      for (let i = 7; i < 15; i++) mat[8][size - 15 + i] = fBits[i];

      const ctx = canvas.getContext("2d");
      const scale = Math.floor(canvas.width / (size + 4));
      const offset = Math.floor((canvas.width - size * scale) / 2);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#041a47";
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (mat[r][c]) ctx.fillRect(offset + c * scale, offset + r * scale, scale, scale);
        }
      }

      // If URL exceeds single-block Version 5 capacity (>106 bytes), draw full-capacity QR onto canvas
      if (rawBytes.length > 106) {
        const qrImg = new Image();
        qrImg.crossOrigin = "anonymous";
        qrImg.onload = () => {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(qrImg, 0, 0, canvas.width, canvas.height);
        };
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&color=041a47&bgcolor=ffffff&data=${encodeURIComponent(text)}`;
      }
    }

    function buildQrShareUrl(cloudUrl) {
      if (!cloudUrl) return "";
      const marker = "/image/upload/";
      const idx = cloudUrl.indexOf(marker);
      const shortPath = idx !== -1 ? cloudUrl.slice(idx + marker.length) : cloudUrl;
      const auraIdx = Math.max(0, AURAS.findIndex((a) => a.id === selectedAura.id));
      return `${window.location.origin}${window.location.pathname}?p=${encodeURIComponent(shortPath)}&a=${auraIdx}`;
    }

    function downloadOutputPng() {
      outputPolaroidCanvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `rupay-aura-${passId || "photo"}.png`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Photo Output saved!");
      }, "image/png");
    }

    // Controls wiring
    document.getElementById("btnStart").addEventListener("click", () => {
      openCameraPreview();
    });

    document.getElementById("btnRetakeCam").addEventListener("click", () => {
      if (isFrozen) {
        isFrozen = false;
      } else {
        stopCamera();
        showScreen(1);
      }
    });

    document.getElementById("btnCapture").addEventListener("click", () => {
      captureAndShowResult();
    });

    document.getElementById("btnSubmitCam").addEventListener("click", () => {
      captureAndShowResult();
    });

    document.getElementById("btnPrint").addEventListener("click", () => {
      buildPhotoOutputCanvas();
      window.print();
    });

    document.getElementById("btnShare").addEventListener("click", () => {
      outputPolaroidCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `rupay-aura-${passId}.png`, { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              title: "RuPay — Own the edge",
              text: `My RuPay Aura: ${selectedAura.name}`,
              files: [file]
            });
            showToast("Shared successfully");
            return;
          } catch (e) {
            if (e.name === "AbortError") return;
          }
        }
        downloadOutputPng();
      }, "image/png");
    });

    document.getElementById("btnQr").addEventListener("click", async () => {
      qrModalBox.style.display = "flex";
      cardModalBox.style.display = "none";
      modalBackdrop.classList.add("active");

      if (cloudinaryPhotoUrl) {
        renderQrCode(qrCanvas, buildQrShareUrl(cloudinaryPhotoUrl));
        qrLabel.textContent = "";
        return;
      }

      qrLabel.textContent = "";
      renderQrCode(qrCanvas, `RUPAY:${passId}:${selectedAura.id}`);
      const url = await uploadPolaroidToCloudinary();
      if (url) {
        renderQrCode(qrCanvas, buildQrShareUrl(url));
      }
      qrLabel.textContent = "";
    });

    document.getElementById("btnViewCard").addEventListener("click", () => {
      buildPhotoOutputCanvas();
      qrModalBox.style.display = "none";
      cardModalBox.style.display = "flex";
      modalBackdrop.classList.add("active");
    });

    document.getElementById("btnDownloadFromQr").addEventListener("click", () => {
      downloadOutputPng();
    });

    document.getElementById("btnCloseModal").addEventListener("click", () => {
      modalBackdrop.classList.remove("active");
    });

    document.getElementById("btnRestart").addEventListener("click", () => {
      showScreen(1);
    });

    // Password Gate + Mobile QR Scan Landing Page (?p=...)
    (function initBoothGateAndQrLanding() {
      const passwordGateOverlay = document.getElementById("passwordGateOverlay");
      const boothPasswordInput = document.getElementById("boothPasswordInput");
      const boothPasswordError = document.getElementById("boothPasswordError");
      const btnUnlockBooth = document.getElementById("btnUnlockBooth");

      const params = new URLSearchParams(window.location.search);
      const pParam = params.get("p");

      if (!pParam) {
        function attemptUnlock() {
          const val = (boothPasswordInput.value || "").trim();
          const valid = val === BOOTH_PASSWORD;
          if (valid) {
            boothPasswordError.textContent = "";
            passwordGateOverlay.classList.add("hidden");
          } else {
            boothPasswordError.textContent = "Incorrect password. Try again.";
            boothPasswordInput.select();
          }
        }
        btnUnlockBooth.addEventListener("click", attemptUnlock);
        boothPasswordInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") attemptUnlock();
        });
        setTimeout(() => boothPasswordInput.focus(), 100);
        return;
      }

      // Guest scanning QR code (?p=...) bypasses the booth password gate and opens our website's preview + download + share screen
      passwordGateOverlay.classList.add("hidden");

      const aIdx = Number(params.get("a") || 0);
      const auraObj = AURAS[aIdx] || AURAS[0];
      const fullImgUrl = pParam.startsWith("http")
        ? pParam
        : `https://res.cloudinary.com/${CLOUDINARY_CLOUD_NAME}/image/upload/${pParam.replace(/^\/+/, "")}`;

      const screenQrLanding = document.getElementById("screenQrLanding");
      const qrLandingImg = document.getElementById("qrLandingImg");

      screen1.classList.remove("active");
      screen2.classList.remove("active");
      screen3.classList.remove("active");
      screenQrLanding.classList.add("active");

      qrLandingImg.src = fullImgUrl;

      document.getElementById("btnQrLandingDownload").addEventListener("click", async () => {
        try {
          const res = await fetch(fullImgUrl);
          const blob = await res.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = blobUrl;
          a.download = "rupay-aura-portrait.jpg";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(blobUrl);
        } catch (_) {
          const dlUrl = fullImgUrl.includes("/upload/")
            ? fullImgUrl.replace("/upload/", "/upload/fl_attachment:rupay-aura-portrait/")
            : fullImgUrl;
          window.location.href = dlUrl;
        }
      });

      document.getElementById("btnQrLandingShare").addEventListener("click", async () => {
        try {
          const res = await fetch(fullImgUrl);
          const blob = await res.blob();
          const file = new File([blob], "rupay-aura-portrait.jpg", { type: blob.type || "image/jpeg" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: "RuPay — Discover Your Aura",
              text: `My RuPay Aura: ${auraObj.name}`,
              files: [file]
            });
            return;
          }
          if (navigator.share) {
            await navigator.share({
              title: "RuPay — Discover Your Aura",
              text: `My RuPay Aura: ${auraObj.name}`,
              url: window.location.href
            });
            return;
          }
        } catch (e) {
          if (e && e.name === "AbortError") return;
        }
        document.getElementById("btnQrLandingDownload").click();
      });
    })();
  </script>
</body>
